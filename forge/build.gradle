plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

base {
    archivesName = "oritech-forge-${minecraft_version}"
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings}-${minecraft_version}"
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                oritech {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                oritech {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir(file("src/main/generated"))
            srcDir(project(":").file("common/src/main/resources"))
            srcDir(project(":").file("common/src/main/generated"))
            exclude("**/.cache")
        }
        java {
            srcDir(project(":").file("common/src/main/java"))
        }
    }
}

repositories {
    mavenCentral()
    maven { url = "https://modmaven.dev" }
    maven { url = "https://beta.cursemaven.com" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.teamresourceful.com/repository/maven-public/" }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = "https://maven.ftb.dev/releases" }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.wispforest.io/releases/' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = "https://maven.minecraftforge.net/" }
}

dependencies {
    // Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    
    // Architectury API
    implementation fg.deobf("dev.architectury:architectury-forge:$architectury_api_version")
    // EMI
    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api")
    // GeckoLib
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:$geckolib_version")
    // Jade
    compileOnly fg.deobf("curse.maven:jade-324717:4780012")
    // JEI
    compileOnly fg.deobf("mezz.jei:jei-$minecraft_version-forge:$jei_version")
    // REI
    compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:$rei_version")

    /// runtime-only

    // recipe viewer runtime
    switch (recipe_viewer.toLowerCase(Locale.ROOT)) {
        case "emi": runtimeOnly fg.deobf("dev.emi:emi-forge:$emi_version"); break
        case "jei": runtimeOnly fg.deobf("mezz.jei:jei-$minecraft_version-forge:$jei_version"); break
        case "rei": runtimeOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:$rei_version"); break
        case "disabled": break
        default: println("Unknown recipe viewer specified: $recipe_viewer. Must be EMI, REI, JEI, or disabled.")
    }
    // Athena (CTM)
    runtimeOnly fg.deobf("earth.terrarium.athena:athena-forge-${minecraft_version}:3.1.2")
    // Jade
    runtimeOnly fg.deobf("curse.maven:jade-324717:4780012")
}

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.property 'version', project.version
    filesMatching(['META-INF/mods.toml']) {
        expand version: version
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": "oritech",
            "Specification-Vendor": "Rearth",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor" :"Rearth",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
